- title: Video Content Creator
  description: >
    In this position, you'll be active on short-form video social media
    platforms on behalf of CrossingsCon, creating and posting original content
    and/or re-posting and engaging with other users' posts. You'll be working
    closely with the existing social media team with support from the design
    department, as well as with Guests of Honor and other convention staff
    during the later parts of the con cycle.

- title: Social Media Manager
  description: >
    In this position, you will engage with social media platforms on behalf of
    Linguistics After Dark (LxAD) and/or CrossingsCon (CC), posting original
    content and sharing and/or engaging with other users’ posts. You’ll be
    working with the existing social media teams, including Sarah (LxAD) and
    Kayla (CC), and with graphic design help from the rest of the design team.

- title: LxAD Audio Editor
  description: >
    In this position, you will be working with videos and podcast episodes by
    trimming beginnings and ends, adding title cards, and possibly adjusting
    sound if needed. You’ll be part of a video/caption team of 3-4 people,
    working on video panels from previous CrossingsCon conventions and new
    Linguistics After Dark episodes as they are recorded.

- title: Events/Programming Coordinator
  description: >
    In this position, you will plan, schedule, and facilitate activities and
    events that take place at CrossingsCon. (You don’t have to facilitate all of
    them! Bi-location is not required, though it would certainly be a valuable
    asset =P) You’ll be collaborating with Sus, our Head of Events, in a
    guests/events team of 3-4 people, with support from the rest of the staff.

- title: Guest Liaison
  description: >
    In this position, you will help support CrosssingsCon’s Guests of Honor —
    from liaising with guests to negotiate contracts, to collaborating with
    guests and our events team to bring guest-centric events to life, to
    assisting with at-con logistics and implementation. You’ll be collaborating
    with Sky, our Head of Guests, and a team of 1-2 other people, with support
    from the rest of the staff.
