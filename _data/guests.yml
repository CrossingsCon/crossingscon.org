- name: Jessica Mary Best
  image: jessica_mary_best.jpg
  bio: >
    Jessica Mary Best is a multi-award-winning freelance writer/editor, an
    amateur singer/songwriter and a well-intentioned ball of pure quivering
    anxiety. Her audio drama work includes creating and scripting *The Strange
    Case of Starship Iris* and *Keep It Steady*, and she has also written for
    *Unwell: A Midwestern Gothic Mystery* and *World Gone Wrong*. Her first
    novel is a queer YA sci-fi mystery called *Stars, Hide Your Fires*. Her
    fanfiction was once quoted very briefly in an NPR feature, which frankly
    continues to boggle her mind.

    We could not be happier to have Jessica join us for CrossingsCon 2025! You
    can find out more about Jessica and her works on [her
    website](https://jessicamarybest.com/).
  works:
    Author of *Stars, Hide Your Fires*; Writer and Executive Producer of *The
    Strange Case of Starship Iris* and *Keep It Steady*

- name: Jessica Day George
  image: jessica_day_george.jpg
  bio: >
    Jessica Day George is the NYT bestselling author of 16 books and counting
    for middle grade and teen readers. She has a degree in Fairy Tales and
    Mythology- okay, Humanities- from Brigham Young University, and loves
    collecting books on Norse mythology, Norwegian folktales, and the sagas.
    Originally from Idaho, she has lived in Delaware, New Jersey, and Utah,
    where she currently lives with her husband and three children. She likes
    books, dark chocolate, dogs, movies, and Dr. Pepper Zero Sugar with a shot
    of coconut syrup.

    We are super excited to have Jessica return for CrossingsCon 2025 after she
    previously joined us at CrossingsCon 2021! You can read more about her [on
    her website](https://www.jessicadaygeorge.com/).
  works:
    Author of the *Dragon Slippers* trilogy, the *Rose Legacy* series, *Silver
    in the Blood*, and more

- name: Megan Whalen Turner
  image: megan_whalen_turner.jpg
  bio: >
    Megan Whalen Turner is an award winning and NYT bestselling author of
    fantasy for children, adults and young adults. Her novel *The Thief* was a
    Newbery Honor book in 1997. It is the first of six books set in the world of
    the Queen’s Thief. Turner has been awarded a Horn Book Honor, been
    shortlisted twice for the Norton Award, and won both the Mythopoeic Award
    and the LA Times Book Award for Young Adult Literature. Satisfying for all
    ages, her books are filled with political machinations, divine intervention,
    friendship, fortitude, and deceit. It is a testament to their staying power
    that twenty five years after *The Thief* was published, readers were eagerly
    awaiting the arrival of *Return of the Thief* in October 2020.

    We are thrilled to have Megan maker her third appearance at CrossingsCon
    2025 after she joined us for CrossingsCon 2021 and 2022! You can read more
    about her [on her website](http://meganwhalenturner.org/).
  works: Author of *The Queen's Thief* series

- name: Seth Dickinson
  image: seth.jpeg
  bio: >
    Seth Dickinson is the author of *The Traitor Baru Cormorant* and *Exordia*,
    and a writer on video game universes including *Destiny*, *House of the
    Dying Sun*, and the upcoming *Subnautica 2*. Seth's favorite book growing up
    was "My Enemy, My Ally" by Diane Duane. Seth dreams of becoming a muscular
    yet small-brained deepwater fish.

    Find out more about what Seth does on [his
    website](https://www.sethdickinson.com/).
  works:
    Author of the *Masquerade* series and *Exordia*; writer for *Destiny*,
    *Destiny 2* and *Subnautica 2*
